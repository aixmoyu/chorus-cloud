name = "chorus-cloud"
main = "src/index.ts"
compatibility_date = "2026-06-11"
compatibility_flags = ["nodejs_compat"]

# 本地开发配置：wrangler dev 会用 .wrangler/state/ 下的本地模拟 D1/KV，
# 下面的占位 ID 仅供本地模式作为存储键使用，不需要是真实资源 ID。
# 生产环境的真实 ID 由 scripts/setup-prod.mjs 生成的 wrangler.prod.toml 提供。

# KV Namespace for client config cache
kv_namespaces = [
  { binding = "CLIENT_CONFIGS", id = "2261586e838f4e34b48d48d7bef2dbf8", preview_id = "00000000-0000-0000-0000-000000000001" }
]

# D1 Database for metadata
[[d1_databases]]
binding = "DB"
database_name = "chorus-cloud-prod"
database_id = "3f35cebd-44c8-4fee-b261-104ca4dab566"
migrations_dir = "migrations"

# Secrets (AUTH_TOKEN, JWT_SECRET) 不在此处配置。
# 本地开发：复制 .dev.vars.example 为 .dev.vars 并填入值（.dev.vars 已在 .gitignore）。
# 生产环境：由 scripts/setup-prod.mjs 通过 `wrangler secret put` 设置（加密存储于 Cloudflare 侧）。

# 请求日志级别（debug|info|warn|error|silent），由日志中间件读取。
# 本地 Node 入口用 CHORUS_CLOUD_LOG_LEVEL 环境变量注入同一个字段。
[vars]
LOG_LEVEL = "info"

# Workers Logs：控制台自动收集/索引/查询所有 console.* 输出。
# 免费版 200k 条/天、保留 3 天；历史问题可回查，无需实时 wrangler tail。
[observability]
enabled = true
